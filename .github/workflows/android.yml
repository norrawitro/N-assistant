name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Releases must always be signed with the same private key, kept in the repository's Actions secrets.
      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::Add the SIGNING_KEYSTORE_BASE64 and SIGNING_STORE_PASSWORD secrets (Settings > Secrets and variables > Actions) before releasing."
            exit 1
          else
            echo "No signing secret: building a test APK signed with the debug key."
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK by version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/n-assistant-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: n-assistant-1.0.${{ github.run_number }}
          path: dist/*.apk

      # Every push to main becomes a GitHub Release; installed apps pick it up as an over-the-air update.
      - name: Publish release for OTA
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" dist/*.apk \
            --title "N-assistant 1.0.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)"
